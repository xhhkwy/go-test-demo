name: banner-fingerprint

x-runtime: &runtime
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  cpus: 1.0
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *runtime
    image: ${SERVER_IMAGE:-banner-fingerprint-server:local}
    build:
      context: .
      target: server
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61}
    command: ["--addr", ":8080", "--rules", "/rules/fingerprints.json"]
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 15s
    volumes:
      - type: bind
        source: ${RULES_DIR:-./rules}
        target: /rules
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  client:
    <<: *runtime
    image: ${CLIENT_IMAGE:-banner-fingerprint-client:local}
    build:
      context: .
      target: client
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61}
    command: ["--input", "/data/scans.json", "--server", "http://server:8080", "--format", "${CLIENT_FORMAT:-table}"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${INPUT_FILE:-./testdata/scans.json}
        target: /data/scans.json
        read_only: true
        bind:
          create_host_path: false

networks:
  backend:
    internal: true
